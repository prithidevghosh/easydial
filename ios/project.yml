name: EasyDial
options:
  bundleIdPrefix: in.easydial
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  EasyDial:
    type: application
    platform: iOS
    sources: [EasyDial]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.easydial.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EasyDial
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record your grocery request when you tap the microphone.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your EasyDial development server on this network.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: EasyDial/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      testTargets: [EasyDialUITests]
  EasyDialUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [EasyDialUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EasyDial
