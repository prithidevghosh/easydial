[project]
name = "easydial-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "openai>=3.57.0",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "qrcode>=8.2",
    "uvicorn[standard]>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "easydial"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
