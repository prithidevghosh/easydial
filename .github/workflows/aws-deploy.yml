name: AWS deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Serialize releases; never terminate an in-flight stateful deployment.
concurrency:
  group: aws-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install uv==0.10.12
      - run: uv sync --directory backend --frozen
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run --directory backend ruff check src tests tools
      - run: uv run --directory backend pytest -q
      - run: uvx --from cfn-lint==1.41.0 cfn-lint deploy/aws/infrastructure.yaml deploy/aws/github-oidc.yaml
      - name: Build Linux image
        run: docker build --platform linux/amd64 -f deploy/container/Dockerfile -t easydial:check .
      - name: Browser cart and onboarding regressions
        run: >-
          docker run --rm --platform linux/amd64 --shm-size=1g
          --entrypoint /bin/sh
          --mount type=bind,src="$PWD/backend/tests",dst=/app/tests,readonly
          -e EASYDIAL_DOM_TESTS=1
          easydial:check -c 'uv run --frozen --group dev pytest -q tests/test_dom.py tests/test_product_details.py tests/test_product_details_dom.py tests/test_exploration_provider_failures.py tests/test_blinkit_cart_identity.py'
      - name: Verify Chrome in Linux
        run: >-
          docker run --rm --platform linux/amd64 --shm-size=1g
          --entrypoint /bin/sh
          --mount type=bind,src="$PWD/deploy/container/smoke.py",dst=/tmp/smoke.py,readonly
          easydial:check -c 'Xvfb :99 -screen 0 1440x1000x24 -nolisten tcp &
          xvfb_pid=$!; trap "kill $xvfb_pid 2>/dev/null || true" EXIT;
          python /tmp/smoke.py'
  deploy:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_STACK: ${{ vars.AWS_STACK || 'easydial-pilot' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: '137420770749'
          role-session-name: easydial-${{ github.run_id }}
      - name: Publish immutable commit image
        run: python3 deploy/aws/deploy.py publish --region "$AWS_REGION" --stack "$AWS_STACK"
      - name: Release through SSM and verify public HTTPS
        run: python3 deploy/aws/deploy.py release --region "$AWS_REGION" --stack "$AWS_STACK"
