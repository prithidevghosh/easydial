AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions deployment access for EasyDial; no permanent AWS keys.
Parameters:
  InfrastructureStack:
    Type: String
    Default: easydial-pilot
  WorkerInstanceId:
    Type: AWS::EC2::Instance::Id
  RepositoryName:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9._/-]+'
  CreateGitHubProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Choose false if token.actions.githubusercontent.com already exists in IAM Identity providers.
Rules:
  TargetAccount:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::AccountId', '137420770749']
        AssertDescription: Use only the authorized AWS account.
Conditions:
  CreateProvider: !Equals [!Ref CreateGitHubProvider, 'true']
Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:prithidevghosh/easydial:ref:refs/heads/main
      Policies:
        - PolicyName: DeployEasyDial
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${InfrastructureStack}/*'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:DescribeImages, ecr:ListImages]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${WorkerInstanceId}'
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: '*'
Outputs:
  GitHubRoleArn:
    Value: !GetAtt DeploymentRole.Arn
