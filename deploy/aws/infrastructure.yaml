AWSTemplateFormatVersion: '2010-09-09'
Description: EasyDial single-worker pilot, private EC2 origin and stable CloudFront HTTPS.
Parameters:
  SourceCommit:
    Type: String
    AllowedPattern: '[a-f0-9]{40}'
    Description: Reviewed public Git commit containing deploy/aws/bootstrap.sh.
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.large, t3.xlarge]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  CloudFrontPrefixList:
    Type: String
    AllowedPattern: 'pl-[a-f0-9]+'
Rules:
  TargetAccount:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::AccountId', '137420770749']
        AssertDescription: Deploy only into the explicitly authorized account.
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.71.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref Gateway}
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.71.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.71.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: {RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Gateway}
  PublicAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet, RouteTableId: !Ref PublicRouteTable}
  NatIp:
    Type: AWS::EC2::EIP
    Properties: {Domain: vpc}
  Nat:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicRoute
    Properties: {SubnetId: !Ref PublicSubnet, AllocationId: !GetAtt NatIp.AllocationId}
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref PrivateRouteTable, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref Nat}
  PrivateAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnet, RouteTableId: !Ref PrivateRouteTable}
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront origin only; administration uses SSM, no public SSH or VNC.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixList
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
  RuntimeSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: EasyDial runtime keys; populate privately before starting the service.
      SecretString: '{}'
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDailyBackups
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration: {NoncurrentDays: 7}
  BackupPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt BackupBucket.Arn, !Sub '${BackupBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  Logs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {RetentionInDays: 14}
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore']
      Policies:
        - PolicyName: EasyDialRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RuntimeSecret
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !GetAtt Logs.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${BackupBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref WorkerRole]}
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Size: 30
      VolumeType: gp3
      Encrypted: true
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-data'}]
  Worker:
    Type: AWS::EC2::Instance
    DependsOn: [PrivateRoute, PrivateAssociation]
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds: [!Ref WorkerSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 1}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-worker'}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker git python3
          systemctl enable --now docker amazon-ssm-agent
          install -d -m 700 /etc/easydial /run/easydial
          cat > /etc/easydial/host.env <<'CONFIG'
          AWS_REGION=${AWS::Region}
          SECRET_ARN=${RuntimeSecret}
          BACKUP_BUCKET=${BackupBucket}
          LOG_GROUP=${Logs}
          DATA_VOLUME_ID=${DataVolume}
          CONFIG
          git clone https://github.com/prithidevghosh/easydial.git /opt/easydial
          git -C /opt/easydial checkout ${SourceCommit}
          bash /opt/easydial/deploy/aws/bootstrap.sh
  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: {InstanceId: !Ref Worker, VolumeId: !Ref DataVolume, Device: /dev/sdf}
  Origin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Arn: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Worker}'
        Name: !Sub '${AWS::StackName}-origin'
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: EasyDial private worker; dynamic webhooks and expiring QR endpoints, no caching.
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: worker
            DomainName: !GetAtt Worker.PrivateDnsName
            VpcOriginConfig:
              VpcOriginId: !GetAtt Origin.Id
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: worker
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: false
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        CustomErrorResponses:
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}
  InstanceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Worker instance health failed; configure notification subscriptions before public launch.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref Worker}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
Outputs:
  PublicUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
  WebhookUrl: {Value: !Sub 'https://${Distribution.DomainName}/webhooks/whatsapp'}
  InstanceId: {Value: !Ref Worker}
  ImageRepository: {Value: !GetAtt Repository.RepositoryUri}
  SecretArn: {Value: !Ref RuntimeSecret}
  BackupBucket: {Value: !Ref BackupBucket}
  DataVolumeId: {Value: !Ref DataVolume}
  LogGroup: {Value: !Ref Logs}
  OutboundIp: {Value: !Ref NatIp}
